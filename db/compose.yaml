services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: always
    ports:
      # ホストからの開発・管理用アクセス（本番環境での外部露出を防ぐため 127.0.0.1 に制限）
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - gateway

  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: neo4j
    restart: always
    ports:
      # Neo4j Browser (HTTP) / Bolt Protocol (ホストからの開発・管理用)
      # 本番環境での外部露出を防ぐため 127.0.0.1 に制限
      - "${DB_BIND_IP:-127.0.0.1}:7474:7474"
      - "${DB_BIND_IP:-127.0.0.1}:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]' # GraphRAG用のAPOCプラグインを自動導入
      TZ: ${TZ}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    networks:
      - gateway
    labels:
      - "traefik.enable=true"
      # /browser 自体の通常ルーティング
      - "traefik.http.routers.neo4j.rule=Host(`${DOMAIN}`) && PathPrefix(`/browser`)"
      - "traefik.http.routers.neo4j.entrypoints=web"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
      
      # /neo4j へのアクセスを /browser/ にリダイレクトする設定
      - "traefik.http.routers.neo4j-redirect.rule=Host(`${DOMAIN}`) && (Path(`/neo4j`) || PathPrefix(`/neo4j/`))"
      - "traefik.http.routers.neo4j-redirect.entrypoints=web"
      - "traefik.http.routers.neo4j-redirect.middlewares=neo4j-redirect-url"
      - "traefik.http.middlewares.neo4j-redirect-url.redirectregex.regex=^http://([^/]+)/neo4j(.*)$$"
      - "traefik.http.middlewares.neo4j-redirect-url.redirectregex.replacement=http://$$1/browser/"

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: always
    environment:
      # NC_DB 未指定時はデフォルトで SQLite (/usr/app/data/noco.db) が使われ、PostgreSQL を汚さずメタデータが分離・永続化される
      TZ: ${TZ}
    volumes:
      - nocodb_data:/usr/app/data
    networks:
      - gateway
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      # サービス定義（8080番ポートに負荷分散転送）
      - "traefik.http.services.nocodb.loadbalancer.server.port=8080"
      
      # /nocodb へのアクセスをプレフィックス除去してコンテナのルート / に転送
      - "traefik.http.routers.nocodb.rule=Host(`${DOMAIN}`) && PathPrefix(`/nocodb`)"
      - "traefik.http.routers.nocodb.entrypoints=web"
      - "traefik.http.routers.nocodb.service=nocodb"
      - "traefik.http.routers.nocodb.middlewares=nocodb-stripprefix"
      - "traefik.http.middlewares.nocodb-stripprefix.stripprefix.prefixes=/nocodb"
      
      # Nuxt.js の静的アセット (/_nuxt) へのリクエストを NocoDB コンテナに転送
      - "traefik.http.routers.nocodb-nuxt.rule=Host(`${DOMAIN}`) && PathPrefix(`/_nuxt`)"
      - "traefik.http.routers.nocodb-nuxt.entrypoints=web"
      - "traefik.http.routers.nocodb-nuxt.service=nocodb"

volumes:
  postgres_data:
    name: postgres_data
  neo4j_data:
    name: neo4j_data
  neo4j_logs:
    name: neo4j_logs
  neo4j_import:
    name: neo4j_import
  neo4j_plugins:
    name: neo4j_plugins
  nocodb_data:
    name: nocodb_data

networks:
  gateway:
    external: true
