services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: always
    ports:
      # ホストからの開発・管理用アクセス（本番環境での外部露出を防ぐため 127.0.0.1 に制限）
      - "${DB_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - gateway

  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: neo4j
    restart: always
    ports:
      # Neo4j Browser (HTTP) / Bolt Protocol (ホストからの開発・管理用)
      # 本番環境での外部露出を防ぐため 127.0.0.1 に制限
      - "${DB_BIND_IP:-127.0.0.1}:7474:7474"
      - "${DB_BIND_IP:-127.0.0.1}:7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: '["apoc"]' # GraphRAG用のAPOCプラグインを自動導入
      TZ: ${TZ}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    networks:
      - gateway
    labels:
      - "traefik.enable=true"
      # /browser 自体の通常ルーティング
      - "traefik.http.routers.neo4j.rule=Host(`${DOMAIN}`) && PathPrefix(`/browser`)"
      - "traefik.http.routers.neo4j.entrypoints=web"
      - "traefik.http.services.neo4j.loadbalancer.server.port=7474"
      
      # /neo4j へのアクセスを /browser/ にリダイレクトする設定
      - "traefik.http.routers.neo4j-redirect.rule=Host(`${DOMAIN}`) && (Path(`/neo4j`) || PathPrefix(`/neo4j/`))"
      - "traefik.http.routers.neo4j-redirect.entrypoints=web"
      - "traefik.http.routers.neo4j-redirect.middlewares=neo4j-redirect-url"
      - "traefik.http.middlewares.neo4j-redirect-url.redirectregex.regex=^http://([^/]+)/neo4j(.*)$$"
      - "traefik.http.middlewares.neo4j-redirect-url.redirectregex.replacement=http://$$1/browser/"

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: "postgres"
      TZ: ${TZ}
    networks:
      - gateway
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      # /adminer (末尾スラッシュなし) へのアクセスを /adminer/ にリダイレクトして Cookie path=/adminer/ と整合性を保つ
      - "traefik.http.routers.adminer-redirect.rule=Host(`${DOMAIN}`) && Path(`/adminer`)"
      - "traefik.http.routers.adminer-redirect.entrypoints=web"
      - "traefik.http.routers.adminer-redirect.middlewares=adminer-redirect-url"
      - "traefik.http.middlewares.adminer-redirect-url.redirectregex.regex=^http://([^/]+)/adminer$$"
      - "traefik.http.middlewares.adminer-redirect-url.redirectregex.replacement=http://$$1/adminer/"

      # /adminer/ 配下のアクセスをプレフィックス除去してコンテナのルート / に転送
      - "traefik.http.routers.adminer.rule=Host(`${DOMAIN}`) && PathPrefix(`/adminer/`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.middlewares=adminer-stripprefix"
      - "traefik.http.middlewares.adminer-stripprefix.stripprefix.prefixes=/adminer"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

volumes:
  postgres_data:
    name: postgres_data
  neo4j_data:
    name: neo4j_data
  neo4j_logs:
    name: neo4j_logs
  neo4j_import:
    name: neo4j_import
  neo4j_plugins:
    name: neo4j_plugins

networks:
  gateway:
    external: true
