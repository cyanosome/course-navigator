[project]
name = "ingestion"
version = "0.1.0"
description = "Course Navigator Data Ingestion and Batch Processing Pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0,<0.29.0",
    "pydantic>=2.13.0,<3.0.0",
    "neo4j>=5.28.0,<6.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0,<0.12.0",
    "psycopg[binary]>=3.3.0,<4.0.0",
    "numpy>=2.0.0",
    "google-genai>=2.20.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
