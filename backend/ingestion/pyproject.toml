[project]
name = "course-ingestion"
version = "0.1.0"
description = "Course Navigator Syllabus Data Ingestion Pipeline (Fetcher, Parser, DB Ingester)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "course-core",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[tool.uv.sources]
course-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
