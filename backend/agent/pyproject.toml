[project]
name = "course-agent"
version = "0.1.0"
description = "Course Navigator Agent (intent parsing, evidence ranking, ADK workflow)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "course-core",
    "pydantic>=2.13.0,<3.0.0",
]

[tool.uv.sources]
course-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
