[project]
name = "course-api"
version = "0.1.0"
description = "Course Navigator Web API (FastAPI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "course-core",
    "fastapi[standard]>=0.137.0,<0.138.0",
]

[tool.uv.sources]
course-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
